name: maya_assistant
description: "Maya / Z-Assistant — bilingual (Arabic/Egyptian/English) voice assistant for Windows and Android."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  speech_to_text: ^6.6.2
  # Pinned exact: 4.2.x ships Kotlin metadata 2.2 which the default Flutter
  # 3.27 Android template (Kotlin 1.8.22) cannot compile.
  flutter_tts: 4.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

name: maya_assistant
description: "Maya / Z-Assistant — bilingual (Arabic/Egyptian/English) voice assistant for Windows and Android."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  speech_to_text: ^6.6.2
  # Pinned exact for reproducible CI: 4.1.0's Windows CMake has broken WinRT
  # linking and 4.2.x needs Kotlin 2.2 (raised in CI + docs).
  flutter_tts: 4.2.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

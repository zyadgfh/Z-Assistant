name: Flutter CI (app/)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze + Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Pub get
        run: flutter pub get
        working-directory: app
      - name: Analyze
        run: flutter analyze
        working-directory: app
      - name: Test
        run: flutter test
        working-directory: app

  build-android:
    name: Build APK (android debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Generate platform folders (kept out of git, as documented)
        run: flutter create . --platforms=android --project-name maya_assistant
        working-directory: app
      - name: Pub get
        run: flutter pub get
        working-directory: app
      - name: Build debug APK
        run: flutter build apk --debug
        working-directory: app

  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Generate platform folders (kept out of git, as documented)
        run: flutter create . --platforms=windows --project-name maya_assistant
        working-directory: app
      - name: Pub get
        run: flutter pub get
        working-directory: app
      - name: Build Windows release
        run: flutter build windows
        working-directory: app

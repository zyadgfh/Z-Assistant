name: Flutter CI (app/)

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze + Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Pub get
        run: flutter pub get
        working-directory: app
      - name: Analyze
        working-directory: app
        shell: bash
        run: set -o pipefail && flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
      - name: Test
        working-directory: app
        shell: bash
        run: set -o pipefail && flutter test 2>&1 | tee test.log
      - name: Report failure to PR
        if: failure() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "❌ **Analyze/Test failed** — log tail:"
            echo '```text'
            (tail -n 100 app/analyze.log 2>/dev/null || true)
            (tail -n 100 app/test.log 2>/dev/null || true)
            echo '```'
          } > body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file body.md

  build-android:
    name: Build APK (android debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Generate platform folders (kept out of git, as documented)
        run: flutter create . --platforms=android --project-name maya_assistant
        working-directory: app
      - name: Raise compileSdk to 36, minSdk to 24, Kotlin to 2.2.0 (flutter_tts requirements)
        working-directory: app
        run: |
          sed -i -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
                 -e 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' \
                 -e 's/minSdk = flutter.minSdkVersion/minSdk = 24/' \
                 -e 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' \
                 android/app/build.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "[0-9.]*"/id "org.jetbrains.kotlin.android" version "2.2.0"/' android/settings.gradle
          grep -n "compileSdk\|minSdk" android/app/build.gradle
          grep -n kotlin android/settings.gradle
      - name: Pub get
        run: flutter pub get
        working-directory: app
      - name: Build debug APK
        working-directory: app
        shell: bash
        run: set -o pipefail && flutter build apk --debug 2>&1 | tee apk.log
      - name: Report failure to PR
        if: failure() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "❌ **Android APK build failed** — log tail:"
            echo '```text'
            (tail -n 100 app/apk.log 2>/dev/null || true)
            echo '```'
          } > body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file body.md

  build-windows:
    name: Build Windows exe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Generate platform folders (kept out of git, as documented)
        run: flutter create . --platforms=windows --project-name maya_assistant
        working-directory: app
      - name: Pub get
        run: flutter pub get
        working-directory: app
      - name: Build Windows release
        working-directory: app
        shell: pwsh
        run: |
          flutter build windows 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report failure to PR
        if: failure() && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Set-Content body.md 'Windows build failed — log tail:'
          Add-Content body.md '```text'
          Get-Content app/build.log -Tail 100 -ErrorAction SilentlyContinue | Add-Content body.md
          Add-Content body.md '```'
          gh pr comment ${{ github.event.pull_request.number }} --body-file body.md
